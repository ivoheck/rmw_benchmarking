apiVersion: batch/v1
kind: Job
metadata:
  name: haw-ros-rwm-messurement
  namespace: ${NAMESPACE}
  labels:
    service: haw-ros-rwm-messurement
spec:
  backoffLimit: 2 
  template:
    metadata:
      labels:
        service: haw-ros-rwm-messurement
    spec:
      restartPolicy: OnFailure  # or Never
      containers:
        - name: haw-ros-rwm-messurement
          image: git.haw-hamburg.de:5000/inf${NAMESPACE}/haw-ros-rwm-messurement:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: measurement-data
              mountPath: "/messurement"
          resources:
            requests:
              cpu: "3"
              memory: "3Gi"
            limits:
              cpu: "3"
              memory: "3Gi"
          env:
            - name: IMAGE_TAG
              value: "${IMAGE_TAG}"
      imagePullSecrets:
        - name: haw-ros-rwm-m-secret
      volumes:
        - name: measurement-data
          persistentVolumeClaim:
            claimName: ros-measurement-pvc